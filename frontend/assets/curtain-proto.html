<!doctype html><html lang="ko"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>반응형 레터 — 언해본 커튼 (프로토타입)</title>
<style>
  @font-face{font-family:"NMJyet";src:url("/assets/fonts/nmj-yet-sub.woff2") format("woff2");font-display:swap;}
  html,body{margin:0;height:100%;background:#efe9dd;overflow:hidden;}
  #c{display:block;width:100vw;height:100vh;touch-action:none;}
  .hint{position:fixed;left:16px;bottom:14px;font:13px/1.5 -apple-system,sans-serif;color:#00000066;}
  .imgslot{position:fixed;left:50%;top:6vh;transform:translateX(-50%);width:min(62vw,720px);height:20vh;
    border:2px dashed #00000026;border-radius:14px;display:flex;align-items:center;justify-content:center;
    color:#00000059;font:600 15px/1.4 -apple-system,sans-serif;text-align:center;pointer-events:none;}
</style></head><body>
<div class="imgslot">여기에 이미지(지붕 등)를 넣으세요<br><small>— 아래 글자 커튼은 훈민정음 언해본</small></div>
<canvas id="c"></canvas>
<div class="hint">마우스를 글자 위로 움직여 보세요 · 커튼이 흔들리며 갈라집니다</div>
<script>
const LINES=["나랏말ᄊᆞ미 듕귁에 달아","문ᄍᆞ와로 서르 ᄉᆞᄆᆞᆺ디 아니ᄒᆞᆯᄊᆡ","이런 젼ᄎᆞ로 어린 ᄇᆡᆨ셩이 니르고져 홇 배 이셔도","ᄆᆞᄎᆞᆷ내 제 ᄠᅳ들 시러 펴디 몯ᄒᆞᇙ 노미 하니라","내 이ᄅᆞᆯ 위ᄒᆞ야 어엿비 너겨","날로 ᄡᅮ메 편안킈 ᄒᆞ고져 ᄒᆞᇙ ᄯᆞᄅᆞ미니라"];
const CH=LINES.join("  ").replace(/\s/g,"").split("");
const cv=document.getElementById('c'),x=cv.getContext('2d');
let W,H,DPR,cols=[],mouse={x:-1e4,y:-1e4},t=0;
const FS=17, SP=FS*1.18, GRAV=0.14, FRIC=0.985, ITER=5, RADIUS=90;

function layout(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;x.setTransform(DPR,0,0,DPR,0,0);
  const roofW=Math.min(W*0.62,720), roofX=(W-roofW)/2, topY=H*0.06+H*0.20+6; // imgslot 아래
  const N=Math.max(14,Math.round(roofW/22));
  cols=[];let idx=0;
  for(let ci=0;ci<N;ci++){
    const colX=roofX+(ci+0.5)*(roofW/N)+(Math.random()*6-3);
    const len=Math.round(16+Math.random()*Math.random()*30);      // 위 촘촘, 아래로 갈수록 짧게(성기게)
    const pts=[];
    for(let i=0;i<len;i++){pts.push({x:colX,y:topY+i*SP,px:colX,py:topY+i*SP,ch:CH[idx%CH.length]});idx++;}
    cols.push({x0:colX,pts,phase:Math.random()*6.28,amp:0.15+Math.random()*0.25});
  }
}
function step(){
  t+=0.016;
  for(const col of cols){
    const P=col.pts;
    for(let i=0;i<P.length;i++){const p=P[i];
      if(i===0){p.x=col.x0;p.y=P[0].py0!==undefined?P[0].py0:p.y;p.px=p.x;p.py=p.y;continue;}
      let vx=(p.x-p.px)*FRIC, vy=(p.y-p.py)*FRIC;
      p.px=p.x;p.py=p.y;
      const breeze=Math.sin(t*1.1+col.phase+i*0.15)*col.amp*(i/P.length);
      p.x+=vx+breeze; p.y+=vy+GRAV;
      const dx=p.x-mouse.x, dy=p.y-mouse.y, d=Math.hypot(dx,dy);
      if(d<RADIUS){const f=(RADIUS-d)/RADIUS*4.5; p.x+=dx/d*f; p.y+=dy/d*f;}
    }
    for(let k=0;k<ITER;k++)for(let i=1;i<P.length;i++){
      const a=P[i-1],b=P[i],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,diff=(d-SP)/d;
      if(i-1===0){b.x-=dx*diff;b.y-=dy*diff;} else {a.x+=dx*diff*0.5;a.y+=dy*diff*0.5;b.x-=dx*diff*0.5;b.y-=dy*diff*0.5;}
    }
    P[0].x=col.x0;
  }
}
function draw(){
  x.clearRect(0,0,W,H);
  x.font=FS+'px "NMJyet",serif';x.textAlign='center';x.textBaseline='middle';
  for(const col of cols){const P=col.pts;
    for(let i=1;i<P.length;i++){const p=P[i],pr=P[i-1];
      const ang=Math.atan2(p.y-pr.y,p.x-pr.x)-Math.PI/2;   // 획이 매달린 방향으로 살짝 기울기
      const op=Math.max(0.05,0.92-(i/P.length)*0.9);
      x.save();x.translate(p.x,p.y);x.rotate(ang*0.35);
      x.fillStyle='rgba(20,18,15,'+op.toFixed(3)+')';x.fillText(p.ch,0,0);x.restore();
    }
  }
}
function loop(){step();draw();requestAnimationFrame(loop);}
window.addEventListener('resize',layout);
window.addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;});
window.addEventListener('pointerleave',()=>{mouse.x=mouse.y=-1e4;});
(async()=>{try{await document.fonts.load('20px "NMJyet"');}catch(e){}layout();loop();})();
</script></body></html>
