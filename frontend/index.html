<link rel="apple-touch-icon" href="/assets/icon-180.png" />
<style>
  @font-face{font-family:"Paperlogy";font-weight:100;src:url("/assets/fonts/Paperlogy-1Thin.ttf") format("truetype");font-display:swap;}
  @font-face{font-family:"Paperlogy";font-weight:400;src:url("/assets/fonts/Paperlogy-4Regular.ttf") format("truetype");font-display:swap;}
  @font-face{font-family:"Paperlogy";font-weight:500;src:url("/assets/fonts/Paperlogy-5Medium.ttf") format("truetype");font-display:swap;}
  @font-face{font-family:"Paperlogy";font-weight:700;src:url("/assets/fonts/Paperlogy-7Bold.ttf") format("truetype");font-display:swap;}
  @font-face{font-family:"Paperlogy";font-weight:900;src:url("/assets/fonts/Paperlogy-9Black.ttf") format("truetype");font-display:swap;}
  @font-face{font-family:"NMJyet";src:url("/assets/fonts/nmj-yet-sub.woff2") format("woff2");font-display:swap;}
  @font-face{font-family:"EBSHunmin";src:url("/assets/fonts/EBSHunmin.woff") format("woff");font-display:swap;}  /* 히어로 커튼용(발) */

  :root{
    --canvas:#f5f5f5;--paper:#fff;--surface:#fafafa;--ink:#0a0a0a;--ink-soft:#171717;
    --mid:#737373;--hairline:#e5e5e5;--ember:#e7000b;--r-card:24px;--r-btn:18px;--r-nested:10px;
    --font:"Paperlogy",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --old:"NMJyet","Paperlogy",serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:var(--font);color:var(--ink);background:var(--canvas);-webkit-font-smoothing:antialiased;
    line-height:1.5;min-height:100dvh;display:flex;align-items:safe center;justify-content:center;padding:24px;position:relative;overflow-x:hidden;}
  .backdrop{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
  .backdrop b{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:var(--font);
    font-weight:900;font-size:min(62vw,900px);color:#ececec;letter-spacing:-.05em;white-space:nowrap;user-select:none;}
  .brandmark{position:fixed;top:20px;left:24px;z-index:2;font-weight:900;font-size:14px;letter-spacing:-.02em;color:var(--ink);}
  .brandmark i{color:var(--ember);font-style:normal;}
  .window{position:relative;z-index:1;width:100%;max-width:640px;min-height:min(78dvh,700px);background:var(--paper);
    border:1px solid var(--hairline);border-radius:var(--r-card);
    box-shadow:0 1px 2px rgba(0,0,0,.04),0 12px 40px -12px rgba(0,0,0,.22),0 0 0 1px rgba(23,23,23,.04);
    padding:40px 40px 32px;display:flex;flex-direction:column;}
  @media(max-width:560px){.window{padding:26px 20px;min-height:84dvh;}body{padding:10px;}}
  .navrow{display:flex;align-items:center;gap:8px;min-height:28px;margin-bottom:20px;}
  .back{background:none;border:0;color:var(--mid);font-family:var(--font);font-size:14px;cursor:pointer;padding:4px 6px;border-radius:8px;}
  .back:hover{background:var(--canvas);color:var(--ink);}
  .crumbs{font-size:13px;color:var(--mid);}.crumbs b{color:var(--ink);font-weight:500;}
  .body{flex:1;display:flex;flex-direction:column;}
  .step{animation:rise .3s cubic-bezier(.2,.7,.2,1);flex:1;display:flex;flex-direction:column;}
  .step.enter{animation:sectionEnter .46s cubic-bezier(.2,.7,.2,1);transform-origin:50% 42%;}  /* 발 젖히고 들어갈 때 커지며 다가옴 */
  @keyframes sectionEnter{from{transform:scale(.86);opacity:0}to{transform:none;opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .label{font-size:12px;letter-spacing:.08em;color:var(--mid);text-transform:uppercase;margin-bottom:14px;}
  .display{font-weight:900;letter-spacing:-.04em;line-height:1.08;font-size:clamp(30px,6.5vw,46px);}
  .old{font-family:var(--old);}
  .yet{font-family:"NMJyet",serif !important;}  /* 나눔명조 옛한글 — 첫가끝 조합(아래아 합쳐짐). 서문 전용, 폴백 금지 */
  .cover-year{font-weight:100;font-size:clamp(40px,9vw,72px);letter-spacing:-.03em;line-height:1;}
  .cover-day{font-weight:900;font-size:clamp(60px,16vw,132px);letter-spacing:-.05em;line-height:.92;}
  /* 히어로: 세종대왕(이미지 슬롯) 아래로 언해본이 발처럼 매달리는 커튼 */
  .hero{position:relative;flex:1;min-height:62vh;overflow:hidden;border-radius:var(--r-nested);}
  .hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;z-index:1;}
  .hero-fore{position:absolute;left:0;right:0;top:0;padding:14px 12px 0;text-align:center;pointer-events:none;z-index:2;}
  .hero-fore *{pointer-events:none;}
  .hero-title .cover-year{font-size:clamp(18px,4vw,30px);}
  .hero-title .cover-day{font-size:clamp(26px,6.5vw,46px);}
  .hero-img{display:block;margin:6px auto 0;height:auto;width:auto;max-height:15vh;max-width:82%;
    object-fit:contain;filter:drop-shadow(0 10px 20px rgba(0,0,0,.16));
    animation:penDrop .95s cubic-bezier(.2,.8,.25,1) both;transform-origin:50% 0;}
  @keyframes penDrop{0%{transform:translateY(-15vh) rotate(-1.6deg);opacity:0}
    55%{transform:translateY(1.4vh) rotate(1.1deg);opacity:1}
    78%{transform:translateY(-.5vh) rotate(-.5deg);opacity:1}
    100%{transform:translateY(0) rotate(0);opacity:1}}
  .lead{font-family:var(--old);font-size:18px;color:var(--ink-soft);line-height:1.95;margin-top:18px;word-break:keep-all;}
  .lead .hl{border-bottom:2px solid var(--ember);padding-bottom:1px;}
  .muted{color:var(--mid);font-size:14px;}
  .btn{font-family:var(--font);font-weight:500;font-size:15px;border:0;cursor:pointer;border-radius:var(--r-btn);
    padding:12px 20px;display:inline-flex;align-items:center;gap:8px;text-decoration:none;transition:transform .08s,background .15s;}
  .btn:active{transform:translateY(1px);}
  .btn.primary{background:var(--ink);color:#fafafa;}.btn.primary:hover{background:#000;}
  .btn.ghost{background:var(--canvas);color:var(--ink);}.btn.ghost:hover{background:#ececec;}
  .btn.lg{padding:15px 22px;font-size:16px;}.btn:disabled{opacity:.45;cursor:default;}
  .foot{margin-top:auto;padding-top:24px;}.actions{display:flex;gap:10px;flex-wrap:wrap;}
  .choices{display:flex;flex-direction:column;gap:12px;margin-top:6px;}
  .choice{width:100%;text-align:left;background:var(--paper);border:1px solid var(--hairline);border-radius:var(--r-nested);
    padding:18px 20px;cursor:pointer;transition:border-color .15s,background .15s;}
  .choice:hover{border-color:var(--ink);background:var(--surface);}
  .choice .ct{display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
  .choice .title{font-family:var(--old);font-weight:900;font-size:26px;letter-spacing:-.02em;}
  .choice .num{font-size:12px;color:var(--mid);}
  .choice .sub{color:var(--mid);font-size:13px;margin-top:5px;line-height:1.5;word-break:keep-all;}
  /* square infographic thumbnails */
  .thumbs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px;}
  @media(max-width:560px){.thumbs{grid-template-columns:1fr;}}
  .thumb{aspect-ratio:1/1;display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--hairline);
    border-radius:var(--r-card);padding:20px;cursor:pointer;transition:border-color .15s,transform .1s,background .15s;}
  .thumb:hover{border-color:var(--ink);transform:translateY(-3px);background:var(--surface);}
  .thumb .art{flex:1;display:flex;align-items:center;justify-content:center;}
  .thumb .tt{font-weight:900;font-size:22px;letter-spacing:-.02em;margin-top:8px;}
  .thumb .ts{color:var(--mid);font-size:13px;margin-top:4px;line-height:1.45;word-break:keep-all;}
  .thumb .go{color:var(--ember);font-size:13px;font-weight:700;margin-top:10px;}
  /* 3-step strip */
  .flow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:18px 0;}
  .flowc{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-nested);padding:14px 10px;text-align:center;}
  .flowc .n{width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fafafa;font-size:12px;font-weight:600;
    display:inline-flex;align-items:center;justify-content:center;margin-bottom:8px;}
  .flowc .t{font-size:13px;font-weight:500;line-height:1.4;word-break:keep-all;}
  /* animated slide carousel */
  .carousel{position:relative;overflow:hidden;border:1px solid var(--hairline);border-radius:var(--r-card);background:var(--surface);margin:6px 0 16px;}
  .track{display:flex;transition:transform .55s cubic-bezier(.2,.7,.2,1);}
  .slide{min-width:100%;padding:30px 24px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;}
  .slide .art{height:150px;display:flex;align-items:center;justify-content:center;}
  .slide .cap{font-weight:700;font-size:19px;letter-spacing:-.02em;}
  .slide .ssub{color:var(--mid);font-size:13px;line-height:1.5;word-break:keep-all;}
  .dots{display:flex;gap:7px;justify-content:center;padding-bottom:16px;}
  .dots i{width:7px;height:7px;border-radius:50%;background:var(--hairline);cursor:pointer;transition:background .2s,width .2s;}
  .dots i.on{background:var(--ink);width:18px;border-radius:4px;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @keyframes flash{0%,100%{opacity:0}50%{opacity:1}}
  .anim-bob{animation:bob 1.6s ease-in-out infinite;}
  .anim-flash{animation:flash 1.8s ease-in-out infinite;}
  /* pen-draws-a-square upload loader (straight strokes = "written by hand") */
  .penwrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px 0;}
  .penload{width:92px;height:92px;overflow:visible;}
  .pl-line{stroke-dasharray:100;stroke-dashoffset:100;animation:pldraw 1.9s linear infinite;}
  @keyframes pldraw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
  .pl-pen{offset-path:path('M25 25 L95 25 L95 95 L25 95 Z');offset-rotate:auto;animation:plmove 1.9s linear infinite;}
  @keyframes plmove{from{offset-distance:0%}to{offset-distance:100%}}
  .penmsg{color:var(--mid);font-size:14px;}
  /* photo gallery */
  .gallery{display:grid;grid-template-columns:1fr 1fr;gap:10px;overflow-y:auto;max-height:46dvh;padding-right:2px;}
  .gcard{position:relative;border:1px solid var(--hairline);border-radius:var(--r-nested);overflow:hidden;background:var(--surface);}
  .gcard img{width:100%;display:block;}
  .gcard .bar{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;font-size:13px;}
  .gcard .like{background:none;border:0;cursor:pointer;color:var(--mid);font-size:13px;padding:2px;}
  .gcard .like.on{color:var(--ember);}
  .gcard .rep{background:none;border:0;cursor:pointer;color:var(--mid);font-size:12px;}
  .gcard .rep:hover{color:var(--ember);}
  .rank{position:absolute;top:8px;left:8px;background:var(--ink);color:#fafafa;font-size:12px;font-weight:700;padding:2px 9px;border-radius:12px;z-index:1;}
  /* photo cropper (rotate + free crop) */
  .cropper{position:absolute;inset:0;z-index:9;background:var(--paper);border-radius:var(--r-card);display:flex;flex-direction:column;padding:20px;}
  .crop-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .crop-stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--surface);border-radius:var(--r-nested);}
  .crop-imgwrap{position:relative;line-height:0;}
  .crop-imgwrap canvas{max-width:100%;max-height:54dvh;display:block;touch-action:none;}
  .crop-box{position:absolute;border:2px solid var(--ember);box-shadow:0 0 0 9999px rgba(0,0,0,.4);cursor:move;touch-action:none;}
  .crop-h{position:absolute;width:18px;height:18px;background:#fff;border:2px solid var(--ember);border-radius:50%;touch-action:none;}
  .crop-h.tl{left:-10px;top:-10px;cursor:nwse-resize;}.crop-h.tr{right:-10px;top:-10px;cursor:nesw-resize;}
  .crop-h.bl{left:-10px;bottom:-10px;cursor:nesw-resize;}.crop-h.br{right:-10px;bottom:-10px;cursor:nwse-resize;}
  .crop-foot{display:flex;gap:10px;margin-top:12px;align-items:center;}
  .type-prev{align-self:stretch;width:100%;max-height:54dvh;overflow:auto;padding:22px;font-size:30px;line-height:1.6;color:var(--ink);white-space:pre-wrap;word-break:break-word;}
  .type-input{margin-top:12px;width:100%;border:1px solid var(--hairline);border-radius:var(--r-nested);padding:12px 14px;font-family:var(--font);font-size:16px;line-height:1.5;resize:none;color:var(--ink);background:var(--canvas);box-sizing:border-box;}
  .cc-h{position:absolute;width:26px;height:26px;transform:translate(-50%,-50%);border-radius:50%;background:rgba(255,255,255,.92);border:2.5px solid var(--ember);box-shadow:0 1px 5px rgba(0,0,0,.35);touch-action:none;cursor:grab;z-index:3;}
  .btn.block{width:100%;justify-content:center;}
  .mindwrap{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-card);padding:8px;margin-top:6px;}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  .field label{font-size:13px;color:var(--mid);}
  .input,select,textarea{font-family:var(--font);font-size:15px;color:var(--ink);background:var(--canvas);
    border:1px solid transparent;border-radius:var(--r-btn);padding:11px 14px;outline:none;width:100%;}
  textarea{min-height:120px;resize:vertical;line-height:1.6;}
  .input:focus,select:focus,textarea:focus{border-color:var(--hairline);background:var(--paper);}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .subcard{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-nested);padding:16px 18px;margin-top:8px;}
  /* 섹션 공통: 큰 글자 + 소제목 + 내용 */
  .sec-title{font-family:"EBSHunmin","Paperlogy",serif;font-weight:900;font-size:clamp(46px,14vw,88px);letter-spacing:-.02em;line-height:1;text-align:center;color:var(--ink);margin-top:8px;}
  .sec-sub{text-align:center;font-weight:700;font-size:clamp(16px,4.5vw,19px);margin-top:14px;color:var(--ink);word-break:keep-all;}
  .sec-desc{text-align:center;color:var(--mid);font-size:14px;line-height:1.6;margin-top:6px;word-break:keep-all;}
  .how-step{margin-top:14px;}
  .how-t{font-weight:800;font-size:16px;color:var(--ink);}
  .how-d{font-weight:400;font-size:13px;color:var(--mid);line-height:1.6;margin-top:4px;word-break:keep-all;}
  /* 편안킈: 만년필 소개 문구(한 폰트로 통일) + 가로 3메뉴 */
  .pen-copy{text-align:center;margin-top:16px;}
  .pen-copy .l1{font-family:var(--font);font-weight:700;font-size:clamp(19px,5vw,25px);line-height:1.75;letter-spacing:-.01em;color:var(--ink);word-break:keep-all;}
  .pen-copy .l1 b{font-weight:900;}
  .pen-copy .l2{margin-top:22px;font-family:var(--font);font-weight:500;font-size:clamp(15px,4vw,18px);line-height:1.75;letter-spacing:-.01em;color:var(--mid);word-break:keep-all;}
  .pen-copy .l2 b{color:var(--ink);font-weight:800;}
  .pen-menu{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:32px;align-items:end;}
  .pen-card{display:flex;flex-direction:column;align-items:center;gap:12px;background:none;border:0;padding:6px 2px;cursor:pointer;font-family:var(--font);transition:transform .12s;}
  .pen-card:hover{transform:translateY(-3px);}
  .pen-card .th{width:100%;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .pen-card .th img{max-width:100%;max-height:100%;object-fit:contain;}
  .pen-card .pen-logo{height:18px;width:auto;max-width:90%;object-fit:contain;}
  .pen-card.soon-card{cursor:default;}
  .pen-card.soon-card:hover{transform:none;}
  .soon-box{width:100%;aspect-ratio:3/4;border:1.5px dashed var(--hairline);border-radius:var(--r-nested);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
  .soon-box b{font-size:clamp(20px,6.5vw,28px);font-weight:900;color:var(--ink-soft);letter-spacing:-.02em;line-height:1;}
  .soon-box span{font-size:12px;color:var(--mid);}
  .soon-cap{height:18px;display:flex;align-items:center;font-size:13px;font-weight:700;color:var(--mid);}
  .rev-logo{display:flex;justify-content:center;align-items:center;margin-top:12px;min-height:38px;}
  .rev-logo img{height:34px;width:auto;max-width:72%;object-fit:contain;}
  /* 인스타형 후기 타임라인 */
  .feed{margin-top:14px;}
  .ig{background:var(--paper);border:1px solid var(--hairline);border-radius:var(--r-nested);overflow:hidden;margin-top:16px;}
  .ig-car{position:relative;}
  .ig-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;aspect-ratio:1/1;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  .ig-track::-webkit-scrollbar{display:none;}
  .ig-track img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:center;background:var(--surface);}
  .ig-count{position:absolute;top:8px;right:10px;background:rgba(0,0,0,.62);color:#fff;font-size:11px;font-weight:600;padding:2px 9px;border-radius:11px;}
  .ig-dots{display:flex;gap:5px;justify-content:center;padding:9px 0 2px;}
  .ig-dots i{width:6px;height:6px;border-radius:50%;background:var(--hairline);}
  .ig-dots i.on{background:var(--ink);}
  .ig-body{padding:12px 16px 16px;}
  .ig-date{font-size:12px;color:var(--mid);}
  .ig-text{font-size:14px;line-height:1.7;color:var(--ink);margin-top:6px;word-break:keep-all;}
  /* 제뜨들: 누끼 손글씨 콜라주 */
  .collage{position:relative;width:100%;height:58dvh;overflow:hidden;margin-top:8px;}
  .collage img{position:absolute;max-width:46%;filter:drop-shadow(0 3px 8px rgba(0,0,0,.18));cursor:pointer;transition:transform .25s cubic-bezier(.2,.7,.2,1);}
  .collage .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mid);font-size:13px;}
  /* 벽돌 사진 벽 (사맛디·제뜨들 공용) + 라이트박스 */
  .brick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;max-height:56dvh;overflow-y:auto;padding-right:2px;}
  .brick img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;background:var(--surface);cursor:pointer;transition:transform .18s;}
  .brick img:active{transform:scale(.97);}
  .brick .empty{grid-column:1/-1;text-align:center;color:var(--mid);font-size:13px;padding:34px 0;}
  .lightbox{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.86);display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out;}
  .lightbox img{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.5);}

  .scatter img{position:absolute;max-width:34%;max-height:38%;cursor:pointer;filter:drop-shadow(0 2px 6px rgba(0,0,0,.12));transition:transform .25s cubic-bezier(.2,.7,.2,1);}
  .scatter img:hover{transform:scale(1.08);}

    border-radius:var(--r-nested);background:var(--surface);margin-top:14px;font-weight:900;font-size:clamp(34px,10vw,64px);letter-spacing:-.03em;padding:14px;word-break:keep-all;}

<body>
  <div class="backdrop"><b>한글</b></div>
  <div class="window"><div class="navrow" id="nav"></div><div class="body" id="stage"></div></div>

<script>
const stage=document.getElementById('stage'), nav=document.getElementById('nav');
let stack=[];
function go(id,ctx){stack.push({id,ctx:ctx||{}});render();}
function back(){if(stack.length>1){stack.pop();render();}}
function reset(id){stack=[{id,ctx:{}}];render();}
function cur(){return stack[stack.length-1];}
function render(){
  if(window.__auto){clearInterval(window.__auto);window.__auto=null;}
  const {id,ctx}=cur(); const s=STEPS[id](ctx);
  nav.innerHTML=(stack.length>1?`<button class="back" onclick="back()">←</button>`:'')+`<span class="crumbs">${s.crumb||''}</span>`;
  stage.innerHTML=''; const el=document.createElement('div'); el.className='step'+(window.__enter?' enter':''); window.__enter=false; el.innerHTML=s.html;
  stage.appendChild(el); if(WIRE[id])WIRE[id](el,ctx);
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
// Render 무료 플랜은 15분 유휴 후 잠들고 깨는 데 ~20s 걸림 → 그 사이 502/네트워크
// 오류가 나므로 자동 재시도(콜드스타트 흡수). 소진되면 친절한 안내를 던진다.
async function api(url,opts,_n){_n=_n||0;let r;
  try{r=await fetch(url,opts);}
  catch(e){if(_n<6){await sleep(4000);return api(url,opts,_n+1);}throw new Error('서버에 연결하지 못했어요. 잠시 후 다시 시도해 주세요.');}
  if((r.status===502||r.status===503||r.status===504)&&_n<6){await sleep(4000);return api(url,opts,_n+1);}
  const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||'오류');return d;}
const esc=s=>String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));

// ---- 손글씨 사진: 촬영/선택 → 회전 + 자유 크롭 → JPEG data URL (키보드 없음) ----
function pickPhoto(cb){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.setAttribute('capture','environment');
  inp.onchange=()=>{ if(inp.files[0]) openCropper(inp.files[0],cb); };
  inp.click();
}
function openCropper(file,cb){
  const img=new Image();
  img.onload=()=>{
    const MAXW=1600, sc=Math.min(1,MAXW/Math.max(img.width,img.height));
    let work=document.createElement('canvas'); work.width=Math.round(img.width*sc); work.height=Math.round(img.height*sc);
    work.getContext('2d').drawImage(img,0,0,work.width,work.height);
    const ov=document.createElement('div'); ov.className='cropper';
    ov.innerHTML=`<div class="crop-head"><button class="btn ghost" id="crRot">↻ 회전</button>
      <div class="row"><button class="btn ghost" id="crCancel">취소</button><button class="btn primary" id="crOk">확인</button></div></div>
      <div class="crop-stage"><div class="crop-imgwrap" id="crWrap"></div></div>`;
    document.querySelector('.window').appendChild(ov);
    const wrap=ov.querySelector('#crWrap'); let box;
    const dispScale=()=>work.getBoundingClientRect().width/work.width;
    function layout(){const s=dispScale(),b=ov.querySelector('#crBox');if(!b)return;
      b.style.left=box.x*s+'px';b.style.top=box.y*s+'px';b.style.width=box.w*s+'px';b.style.height=box.h*s+'px';}
    function mount(){
      wrap.innerHTML=''; wrap.appendChild(work);
      box={x:work.width*0.08,y:work.height*0.08,w:work.width*0.84,h:work.height*0.84};
      const b=document.createElement('div'); b.className='crop-box'; b.id='crBox';
      b.innerHTML='<div class="crop-h tl"></div><div class="crop-h tr"></div><div class="crop-h bl"></div><div class="crop-h br"></div>';
      wrap.appendChild(b); bindDrag(b); requestAnimationFrame(layout);
    }
    function bindDrag(b){
      let mode=null,sx,sy,ob;
      const start=(e,m)=>{mode=m;sx=e.clientX;sy=e.clientY;ob={...box};e.preventDefault();e.stopPropagation();
        window.addEventListener('pointermove',move);window.addEventListener('pointerup',end);};
      const move=(e)=>{const s=dispScale(),dx=(e.clientX-sx)/s,dy=(e.clientY-sy)/s;let n={...ob};
        if(mode==='move'){n.x=ob.x+dx;n.y=ob.y+dy;}
        else{if(mode.includes('l')){n.x=ob.x+dx;n.w=ob.w-dx;}if(mode.includes('r'))n.w=ob.w+dx;
             if(mode.includes('t')){n.y=ob.y+dy;n.h=ob.h-dy;}if(mode.includes('b'))n.h=ob.h+dy;}
        n.w=Math.max(40,n.w);n.h=Math.max(40,n.h);
        n.x=Math.max(0,Math.min(n.x,work.width-n.w));n.y=Math.max(0,Math.min(n.y,work.height-n.h));
        n.w=Math.min(n.w,work.width-n.x);n.h=Math.min(n.h,work.height-n.y);box=n;layout();};
      const end=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',end);mode=null;};
      b.addEventListener('pointerdown',e=>start(e,'move'));
      ['tl','tr','bl','br'].forEach(m=>b.querySelector('.'+m).addEventListener('pointerdown',e=>start(e,m)));
    }
    ov.querySelector('#crRot').onclick=()=>{const c=document.createElement('canvas');c.width=work.height;c.height=work.width;
      const x=c.getContext('2d');x.translate(c.width,0);x.rotate(Math.PI/2);x.drawImage(work,0,0);work=c;mount();};
    ov.querySelector('#crCancel').onclick=()=>{window.removeEventListener('resize',layout);ov.remove();};
    ov.querySelector('#crOk').onclick=()=>{
      const CAP=1000,s=Math.min(1,CAP/Math.max(box.w,box.h)),out=document.createElement('canvas');
      out.width=Math.round(box.w*s);out.height=Math.round(box.h*s);
      out.getContext('2d').drawImage(work,box.x,box.y,box.w,box.h,0,0,out.width,out.height);
      const data=out.toDataURL('image/jpeg',0.85);window.removeEventListener('resize',layout);ov.remove();cb(data);};
    mount(); window.addEventListener('resize',layout);
  };
  img.src=URL.createObjectURL(file);
}
function uid(){let u=localStorage.getItem('sm_uid');if(!u){u='u'+Math.random().toString(36).slice(2,10);localStorage.setItem('sm_uid',u);}return u;}

// ---- 폰트 템플릿: 페이지별 네 모서리 맞추기 (자동 검출 실패해도 손으로 → 정렬이 절대 하드실패 안 함) ----
// resolve: 이미지 원본 픽셀 좌표의 네 점 [[x,y]*4] (TL,TR,BR,BL 근처), 취소 시 null
function confirmCorners(file, pageLabel){return new Promise(resolve=>{
  const img=new Image();
  img.onload=async()=>{
    const nW=img.naturalWidth,nH=img.naturalHeight;
    let auto=null;
    try{const fd=new FormData();fd.append('file',file);const d=await api('/api/detect-corners',{method:'POST',body:fd});auto=d.corners;}catch(e){}
    const ov=document.createElement('div');ov.className='cropper';
    ov.innerHTML=`<div class="crop-head"><span class="muted">${pageLabel} · 모서리 맞추기</span>
        <div class="row"><button class="btn ghost" id="ccCancel">취소</button><button class="btn primary" id="ccOk">확인</button></div></div>
      <div class="crop-stage"><div class="crop-imgwrap" id="ccWrap"></div></div>
      <div class="crop-foot"><span class="muted">검은 모서리 사각형 4곳에 점을 맞춰주세요 · 자동으로 못 잡으면 손으로 끌어 조정</span></div>`;
    document.querySelector('.window').appendChild(ov);
    const wrap=ov.querySelector('#ccWrap');
    // 검증된 크롭퍼와 동일하게 캔버스로 표시(=레이아웃 안정), 좌표는 이미지 분수(0~1)로 저장
    const cv=document.createElement('canvas');cv.width=nW;cv.height=nH;cv.getContext('2d').drawImage(img,0,0);
    cv.style.touchAction='none';cv.style.display='block';
    // flex 안 세로 이미지가 0폭으로 접히지 않게: max-*를 끄고 뷰포트 기준 표시 크기를 명시
    cv.style.maxWidth='none';cv.style.maxHeight='none';
    const availW=((document.querySelector('.window')||document.body).clientWidth||window.innerWidth)-48;
    const availH=window.innerHeight*0.52;
    const sc=Math.min(1,availW/nW,availH/nH)||0.2;
    cv.style.width=(nW*sc)+'px';cv.style.height=(nH*sc)+'px';
    wrap.appendChild(cv);
    const clamp=v=>Math.min(1,Math.max(0,v));
    const pts=(auto&&auto.length===4)?auto.map(p=>[clamp(p[0]/nW),clamp(p[1]/nH)])
                                      :[[.08,.08],[.92,.08],[.92,.92],[.08,.92]];
    const NS='http://www.w3.org/2000/svg',svg=document.createElementNS(NS,'svg');
    svg.setAttribute('viewBox','0 0 1 1');svg.setAttribute('preserveAspectRatio','none');
    svg.setAttribute('style','position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none');
    const poly=document.createElementNS(NS,'polygon');
    poly.setAttribute('fill','rgba(231,0,11,.08)');poly.setAttribute('stroke','#e7000b');
    poly.setAttribute('stroke-width','1.5');poly.setAttribute('vector-effect','non-scaling-stroke');
    svg.appendChild(poly);wrap.appendChild(svg);
    const drawQuad=()=>poly.setAttribute('points',pts.map(p=>`${p[0]},${p[1]}`).join(' '));
    function mkHandle(i){const h=document.createElement('div');h.className='cc-h';wrap.appendChild(h);
      const place=()=>{h.style.left=(pts[i][0]*100)+'%';h.style.top=(pts[i][1]*100)+'%';};place();
      const move=e=>{const r=cv.getBoundingClientRect();
        pts[i]=[clamp((e.clientX-r.left)/r.width),clamp((e.clientY-r.top)/r.height)];place();drawQuad();};
      const end=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',end);};
      h.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();window.addEventListener('pointermove',move);window.addEventListener('pointerup',end);});
    }
    [0,1,2,3].forEach(mkHandle);drawQuad();
    ov.querySelector('#ccCancel').onclick=()=>{ov.remove();resolve(null);};
    ov.querySelector('#ccOk').onclick=()=>{ov.remove();resolve(pts.map(p=>[Math.round(p[0]*nW),Math.round(p[1]*nH)]));};
  };
  img.src=URL.createObjectURL(file);
});}

// ---- 내 손글씨 폰트 보관(IndexedDB) → 제 뜯을에서 타이핑용으로 재사용 ----
// 폰트는 5MB라 localStorage엔 못 넣어 IndexedDB에 Blob으로 저장한다. 렌더용 이름은
// 충돌/재빌드 문제를 피하려 매 저장마다 고유 alias를 부여한다.
function _fontDB(){return new Promise((res,rej)=>{const r=indexedDB.open('ownfont',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function saveMyFont(rec){try{const db=await _fontDB();await new Promise((res,rej)=>{const t=db.transaction('f','readwrite');t.objectStore('f').put(rec,'my');t.oncomplete=res;t.onerror=()=>rej(t.error);});}catch(e){}}
async function getMyFont(){try{const db=await _fontDB();return await new Promise(res=>{const t=db.transaction('f','readonly'),q=t.objectStore('f').get('my');q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);});}catch(e){return null;}}
let _myAlias=null;
async function ensureMyFont(){const rec=await getMyFont();if(!rec)return null;
  if(_myAlias!==rec.alias){const ff=new FontFace(rec.alias,`url(${URL.createObjectURL(rec.blob)})`);await ff.load();document.fonts.add(ff);_myAlias=rec.alias;}
  return rec;}

// 타이핑 → 내 폰트로 캔버스 렌더 → PNG data URL. cb(dataURL, text)
function composeInMyFont(cb){(async()=>{
  const rec=await ensureMyFont();
  if(!rec){alert('먼저 ‘사맛디 › 폰트 만들기’에서 손글씨 폰트를 만들어 주세요.');return;}
  const ov=document.createElement('div');ov.className='cropper';
  ov.innerHTML=`<div class="crop-head"><span class="muted">내 폰트로 쓰기</span>
      <div class="row"><button class="btn ghost" id="tyCancel">취소</button><button class="btn primary" id="tyOk">게시</button></div></div>
    <div class="crop-stage"><div id="tyPrev" class="type-prev"></div></div>
    <textarea id="tyText" class="type-input" rows="3" maxlength="140" placeholder="여기에 마음을 적어보세요"></textarea>`;
  document.querySelector('.window').appendChild(ov);
  const ta=ov.querySelector('#tyText'),prev=ov.querySelector('#tyPrev');
  prev.style.fontFamily=`"${rec.alias}"`;
  const sync=()=>{prev.textContent=ta.value||'여기에 마음을 적어보세요';};
  ta.oninput=sync;sync();setTimeout(()=>ta.focus(),50);
  ov.querySelector('#tyCancel').onclick=()=>ov.remove();
  ov.querySelector('#tyOk').onclick=async()=>{const text=ta.value.trim();if(!text){ta.focus();return;}
    await document.fonts.load(`48px "${rec.alias}"`);
    ov.remove();cb(renderTextPNG(text,rec.alias),text);};
})();}

// 정사각형에 가까운 카드에 텍스트를 줄바꿈해 그린다 (흰 배경, 검정 글씨)
function renderTextPNG(text,fam){
  const W=900,PAD=90,maxW=W-PAD*2,c=document.createElement('canvas'),x=c.getContext('2d');
  const wrap=size=>{x.font=`${size}px "${fam}"`;const out=[];
    text.split('\n').forEach(para=>{if(!para){out.push('');return;}
      let line='';for(const ch of para){const t=line+ch;
        if(x.measureText(t).width>maxW&&line){out.push(line);line=ch;}else line=t;}
      out.push(line);});return out;};
  let size=60,lines=[],lh=90;
  for(;size>=26;size-=2){lines=wrap(size);lh=size*1.5;if(lines.length*lh<=W-PAD*2)break;}
  const H=Math.max(520,Math.min(1300,Math.round(lines.length*lh+PAD*2)));
  c.width=W;c.height=H;x.fillStyle='#fff';x.fillRect(0,0,W,H);
  x.fillStyle='#0a0a0a';x.font=`${size}px "${fam}"`;x.textBaseline='top';x.textAlign='left';
  const startY=(H-lines.length*lh)/2;
  lines.forEach((ln,i)=>x.fillText(ln,PAD,startY+i*lh));
  return c.toDataURL('image/png');}

// ---- 공유 카드: 펜 손글씨 사진(또는 내 폰트 글) → 공유 이미지 ----
const CAMPAIGN='2026 한글날 · 훈민정음 반포 580년 · 가갸날 100년';
const loadImage=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});
// 누끼: 밝은 배경 → 투명, 어두운 획만 남김 (사맛디 흩뿌림용). 흰 종이+검은 잉크 가정.
async function cutout(dataURL){
  try{const img=await loadImage(dataURL);const c=document.createElement('canvas');
    const s=Math.min(1,520/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));
    c.width=Math.round((img.naturalWidth||img.width)*s);c.height=Math.round((img.naturalHeight||img.height)*s);
    const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);
    const d=x.getImageData(0,0,c.width,c.height),a=d.data;
    for(let i=0;i<a.length;i+=4){const lum=0.299*a[i]+0.587*a[i+1]+0.114*a[i+2];
      a[i+3]=lum>150?0:Math.round(255*(1-lum/150));}
    x.putImageData(d,0,0);return c.toDataURL('image/png');
  }catch(e){return dataURL;}
}
function dataURLtoBlob(u){const [h,b]=u.split(',');const m=h.match(/:(.*?);/)[1],bin=atob(b),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:m});}
function _roundRect(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}

// opts: {photo?:dataURL, text?, fontAlias?, pillar?, caption?} → 1080x1350 canvas
async function renderCard(opts){
  const o=opts||{},W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  await document.fonts.ready;
  try{await document.fonts.load('900 40px "Paperlogy"');if(o.pillar)await document.fonts.load('40px "NMJyet"');if(o.fontAlias)await document.fonts.load(`80px "${o.fontAlias}"`);}catch(e){}
  x.fillStyle='#ffffff';x.fillRect(0,0,W,H);
  x.strokeStyle='#ececec';x.lineWidth=2;x.strokeRect(24,24,W-48,H-48);
  x.textAlign='left';x.textBaseline='top';
  if(o.pillar){x.fillStyle='#e7000b';x.font='40px "NMJyet",serif';x.fillText(o.pillar,90,80);}
  if(o.caption){x.fillStyle='#737373';x.font='500 30px "Paperlogy"';x.fillText(o.caption,90,o.pillar?142:90);}
  const cy0=210,cx0=90,cw=W-180,ch=H-210-250;
  if(o.photo){const img=await loadImage(o.photo);const iw=img.naturalWidth||img.width,ih=img.naturalHeight||img.height;
    const r=Math.min(cw/iw,ch/ih),dw=iw*r,dh=ih*r;x.drawImage(img,cx0+(cw-dw)/2,cy0+(ch-dh)/2,dw,dh);}
  else if(o.text){const fam=o.fontAlias||'Paperlogy';
    const wrap=s=>{x.font=`${s}px "${fam}"`;const out=[];String(o.text).split('\n').forEach(p=>{if(!p){out.push('');return;}let ln='';for(const chr of p){const t=ln+chr;if(x.measureText(t).width>cw&&ln){out.push(ln);ln=chr;}else ln=t;}out.push(ln);});return out;};
    let size=96,lines=[],lh=140;for(;size>=40;size-=4){lines=wrap(size);lh=size*1.5;if(lines.length*lh<=ch)break;}
    x.fillStyle='#0a0a0a';x.font=`${size}px "${fam}"`;x.textAlign='center';x.textBaseline='middle';
    const sy=cy0+ch/2-(lines.length-1)*lh/2;lines.forEach((ln,i)=>x.fillText(ln,W/2,sy+i*lh));x.textAlign='left';x.textBaseline='top';}
  const fy=H-140;                                   // 브랜드 없이: 액센트 + 캠페인만
  x.fillStyle='#e7000b';_roundRect(x,90,fy,54,10,5);x.fill();
  x.fillStyle='#0a0a0a';x.font='900 36px "Paperlogy"';x.textAlign='left';x.textBaseline='top';x.fillText('2026 한글날',90,fy+28);

// ---- 히어로 커튼: 세종대왕(슬롯) 아래로 언해본이 발처럼 매달림 ----
// 평소엔 완전히 정지. 마우스로 쓰다듬을 때만 발이 아주 조금 따라 흔들린다. 글꼴=EBS 훈민정음(옛한글은 NMJyet 폴백).
// 커튼용 = 언해본 현대 표기 전사본(아래아·첫가끝을 현대 음절로) → EBS가 음절을 깔끔히 조합.
// (또렷한 옛한글 원문은 서문 화면에서 나눔명조 옛한글로 별도 표시)
const SEOMUN_LINES=["나랏말싸미 듕귁에 달아","서르 사맛디 아니할쌔","이런 젼차로 어린 백셩이","니르고져 홀 빼이셔도","마참내 제 뜨들 시러 펴디","몯할 노미 하니라","내 이랄 위하야 어엿비 너겨","새로 스믈여듧 글자를 맹가노니","날로 쑤메 편안킈 하고져","할 따라미니라"];
function mountCurtain(cv, slot){
  // 발 속 세 구절만 볼드(붉게)로 강조 → 누르면 그 메뉴로. (누르다 스치면 발이 흔들림)
  const TARGETS=[{txt:"사맛디",go:"rung1"},{txt:"제뜨들",go:"rung2"},{txt:"편안킈",go:"pyeonan"}];
  // 각 줄 = 세로 한 칸(열). 공백 제거 → 화면 비율이 바뀌어도 줄 구성(어느 글자가 어느 열)은 고정.
  const LINES=SEOMUN_LINES.map(s=>s.replace(/\s/g,""));
  const LINE_CH=LINES.map(l=>l.split(""));
  const LINE_TAG=LINES.map(l=>{const t=new Array(l.length).fill(null);
    for(const tg of TARGETS){const p=l.indexOf(tg.txt);if(p>=0)for(let k=0;k<tg.txt.length;k++)t[p+k]=tg.go;}return t;});
  const N=LINES.length, MAXLEN=Math.max(1,...LINES.map(l=>l.length));
  const x=cv.getContext('2d');
  let FS=20,SP=FS*1.28,RADIUS=60;
  const GRAV=0.10,FRIC=0.92,ITER=4,PUSH=1.7;   // 데스크톱 과한 흔들림 완화
  let W,H,DPR,cols=[],mouse={x:-1e4,y:-1e4},active=false,T=0,parting=false,partT0=0,partGo=null,dropT0=0,DROP=60;
  function layout(){
    DPR=Math.min(2,window.devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;if(!W||!H)return false;
    cv.width=W*DPR;cv.height=H*DPR;x.setTransform(DPR,0,0,DPR,0,0);
    const cr=cv.getBoundingClientRect(), ir=slot.getBoundingClientRect();
    let _ty=0;try{_ty=(new DOMMatrix(getComputedStyle(slot).transform)).m42||0;}catch(e){}  // 낙하 애니 중에도 정지 위치 기준
    const penBottom=Math.max(0,(ir.bottom-_ty)-cr.top);   // 만년필 아래 끝
    const bandW=W*0.9, bandX=(W-bandW)/2, colW=bandW/N;   // N열 고정, 가운데
    const availH=Math.max(40,H-penBottom-26);
    // 폭·높이 둘 다 맞춰 글자 크기만 산출 — 줄 구성은 절대 안 바뀜
    FS=Math.max(11,Math.min(26,Math.floor(Math.min(colW/1.12,(availH/MAXLEN)/1.28))));
    SP=FS*1.28;RADIUS=FS*2.5;DROP=H*0.10;
    const topY=penBottom+Math.round(FS*0.7);   // 첫 글자가 만년필 끝 바로 아래에서 시작(펜이 안 가림)
    cols=[];
    for(let ci=0;ci<N;ci++){
      const colX=bandX+bandW-(ci+0.5)*colW;               // 우→좌 (세로쓰기)
      const ch=LINE_CH[ci],tg=LINE_TAG[ci],pts=[];
      for(let i=0;i<ch.length;i++)pts.push({x:colX,y:topY+i*SP,px:colX,py:topY+i*SP,ch:ch[i],g:tg[i]});
      if(pts.length)cols.push({x0:colX,y0:topY,pts});
    }
    return true;
  }
  function dropOffset(){   // 발 앵커를 만년필의 실제 translateY에 붙임 → 함께 떨어지며 출렁(글자는 관성으로 살짝 흔들)
    try{return (new DOMMatrix(getComputedStyle(slot).transform)).m42||0;}catch(e){return 0;}
  }
  function step(){
    const doff=dropOffset();
    for(const col of cols){const P=col.pts;
      for(let i=1;i<P.length;i++){const p=P[i];
        const vx=(p.x-p.px)*FRIC, vy=(p.y-p.py)*FRIC; p.px=p.x;p.py=p.y; p.x+=vx; p.y+=vy+GRAV;
        if(active){const dx=p.x-mouse.x,dy=p.y-mouse.y,d=Math.hypot(dx,dy);
          if(d<RADIUS&&d>0.01){const f=(RADIUS-d)/RADIUS*PUSH; p.x+=dx/d*f; p.y+=dy/d*f;}}
      }
      for(let k=0;k<ITER;k++){P[0].x=col.x0;P[0].y=col.y0+doff;
        for(let i=1;i<P.length;i++){const a=P[i-1],b=P[i],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,diff=(d-SP)/d;
          if(i-1===0){b.x-=dx*diff;b.y-=dy*diff;}else{a.x+=dx*diff*0.5;a.y+=dy*diff*0.5;b.x-=dx*diff*0.5;b.y-=dy*diff*0.5;}}}
      P[0].x=col.x0;P[0].y=col.y0+doff;
    }
  }
  function glyph(p,i,len,alpha){    // 볼드 구절은 붉게·크게·부드럽게 숨쉬듯 맥동, 나머지는 은은히
    if(p.g){const s=1.3*(1+0.05*Math.sin(T*2));   // 연속 배율(반올림 X) → 매끈한 ease-in-out
      x.save();x.scale(s,s);x.font='900 '+FS+'px "EBSHunmin","Paperlogy",serif';x.fillStyle='rgba(231,0,11,'+alpha.toFixed(3)+')';x.fillText(p.ch,0,0);x.restore();}
    else{const op=Math.max(0.32,0.95-(i/Math.max(1,len-1))*0.58)*alpha;
      x.font=FS+'px "EBSHunmin","Paperlogy",serif';x.fillStyle='rgba(20,18,15,'+op.toFixed(3)+')';x.fillText(p.ch,0,0);}
  }
  function draw(){
    x.clearRect(0,0,W,H);x.textAlign='center';x.textBaseline='middle';
    for(const col of cols){const P=col.pts;
      for(let i=0;i<P.length;i++){const p=P[i];let ang=0;if(i>0){const pr=P[i-1];ang=(Math.atan2(p.y-pr.y,p.x-pr.x)-Math.PI/2)*0.12;}
        x.save();x.translate(p.x,p.y);if(ang)x.rotate(ang);glyph(p,i,P.length,1);x.restore();}
    }
  }
  function drawPart(){              // 발을 젖히고 문으로 들어가듯 좌우로 갈라지며 페이드 → 메뉴 진입
    const D=580,e=Math.min(1,(performance.now()-partT0)/D),ease=e<0.5?2*e*e:1-Math.pow(-2*e+2,2)/2,cx=W/2;
    x.clearRect(0,0,W,H);x.textAlign='center';x.textBaseline='middle';
    for(const col of cols){const P=col.pts,dir=col.x0<cx?-1:1,shift=dir*ease*W*0.62;
      for(let i=0;i<P.length;i++){const p=P[i];x.save();x.translate(p.x+shift,p.y);glyph(p,i,P.length,1-ease);x.restore();}}
    if(e>=1&&partGo){const g=partGo;partGo=null;window.__enter=true;if(window.go)window.go(g);}  // 다음 화면 커지며 등장
  }
  function hit(mx,my){let best=null,bd=1e9;for(const col of cols)for(const p of col.pts){if(!p.g)continue;const d=Math.hypot(p.x-mx,p.y-my);if(d<bd){bd=d;best=p;}}return (best&&bd<FS*1.7)?best.g:null;}
  let _prev=0,_acc=0;
  function loop(ts){if(!document.body.contains(cv))return;requestAnimationFrame(loop);
    ts=ts||performance.now();if(!_prev)_prev=ts;let dt=ts-_prev;_prev=ts;if(dt>50)dt=50;
    if(parting){drawPart();return;}
    _acc+=dt;let did=false;while(_acc>=16.67){T+=0.016;step();_acc-=16.67;did=true;}  // 물리 60fps 고정(고주사율서도 동일 속도)
    if(did)draw();}
  cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();const mx=e.clientX-r.left,my=e.clientY-r.top;mouse.x=mx;mouse.y=my;active=true;cv.style.cursor=hit(mx,my)?'pointer':'default';});
  cv.addEventListener('pointerleave',()=>{active=false;mouse.x=mouse.y=-1e4;});
  cv.addEventListener('click',e=>{if(parting)return;const r=cv.getBoundingClientRect();const g=hit(e.clientX-r.left,e.clientY-r.top);if(g){parting=true;partT0=performance.now();partGo=g;}});
  let ro; if(window.ResizeObserver){ro=new ResizeObserver(()=>{if(!parting)layout();});ro.observe(cv);}
  (async()=>{try{await document.fonts.load('16px "EBSHunmin"');await document.fonts.load('16px "Paperlogy"');}catch(e){}
    if(slot.tagName==='IMG'&&!slot.complete){await new Promise(r=>{slot.onload=r;slot.onerror=r;});}
    let tries=0;(function w(){if(layout()||tries++>60){dropT0=performance.now();loop();}else requestAnimationFrame(w);})();})();
}

// ---- 사각사각: 실생활 소리 (WebAudio 합성; 나중에 실제 녹음으로 교체 가능) ----
let _ac; function actx(){_ac=_ac||new (window.AudioContext||window.webkitAudioContext)();if(_ac.state==='suspended')_ac.resume();return _ac;}
function noiseBuf(c,d){const b=c.createBuffer(1,Math.floor(c.sampleRate*d),c.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;return b;}
function playRain(){const c=actx(),t=c.currentTime,s=c.createBufferSource();s.buffer=noiseBuf(c,2.2);const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=1100;const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.32,t+0.3);g.gain.linearRampToValueAtTime(0,t+2.1);s.connect(f);f.connect(g);g.connect(c.destination);s.start(t);}
function playKnock(){const c=actx();[0,0.24].forEach(dt=>{const t=c.currentTime+dt,s=c.createBufferSource();s.buffer=noiseBuf(c,0.13);const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=320;const g=c.createGain();g.gain.setValueAtTime(0.7,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.13);s.connect(f);f.connect(g);g.connect(c.destination);s.start(t);});}
function playBell(){const c=actx(),t=c.currentTime;[784,1176,1568].forEach((fr,i)=>{const o=c.createOscillator();o.type='sine';o.frequency.value=fr;const g=c.createGain(),a=0.28/(i+1);g.gain.setValueAtTime(a,t);g.gain.exponentialRampToValueAtTime(0.0008,t+2);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+2);});}
function playClock(){const c=actx();for(let i=0;i<4;i++){const t=c.currentTime+i*0.5,o=c.createOscillator();o.type='square';o.frequency.value=2100;const g=c.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.28,t+0.004);g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+0.06);}}
function playDrip(){const c=actx(),t=c.currentTime,o=c.createOscillator();o.type='sine';o.frequency.setValueAtTime(1500,t);o.frequency.exponentialRampToValueAtTime(480,t+0.18);const g=c.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.45,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+0.26);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+0.28);}
const SOUNDS=[{id:'rain',name:'창밖의 빗소리',play:playRain},{id:'knock',name:'문 두드리는 소리',play:playKnock},{id:'bell',name:'처마 끝 풍경',play:playBell},{id:'clock',name:'시계 초침',play:playClock},{id:'drip',name:'수도꼭지 물방울',play:playDrip}];

  font_upload:(el)=>{
    const fi=el.querySelector('#file'),drop=el.querySelector('#drop'),bb=el.querySelector('#buildBtn'),fn=el.querySelector('#fname'),st=el.querySelector('#status');let ch=[];
    drop.onclick=()=>fi.click();
    ['dragover','dragenter'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('over');}));
    ['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('over');}));
    drop.addEventListener('drop',ev=>{if(ev.dataTransfer.files.length)sf(ev.dataTransfer.files);});
    fi.onchange=()=>{if(fi.files.length)sf(fi.files);};
    function sf(l){ch=[...l];fn.textContent=ch.length===1?ch[0].name:`${ch.length}개`;bb.disabled=false;}
    bb.onclick=async()=>{bb.disabled=true;
      // 페이지마다 모서리 맞추기 → 정렬 실패(마커 못 찾음)로 죽던 문제 해결
      const corners=[];
      for(let i=0;i<ch.length;i++){
        st.innerHTML=`<div class="note info">모서리 맞추기 ${i+1}/${ch.length}…</div>`;
        const c=await confirmCorners(ch[i], ch.length>1?`${i+1}쪽`:'스캔');
        if(c===null){st.innerHTML='';bb.disabled=false;return;}  // 취소
        corners.push(c);
      }
      st.innerHTML=PEN;
      const fd=new FormData();ch.forEach(f=>fd.append('files',f));fd.append('family',el.querySelector('#family').value||'내손글씨');fd.append('fmt',el.querySelector('#fmt').value);
      fd.append('corners',JSON.stringify(corners));
      try{const d=await api('/api/build',{method:'POST',body:fd});
        // 폰트를 응답에서 바로 Blob으로 → 서버 재시작과 무관하게 다운로드/미리보기 가능
        const bin=atob(d.font),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
        const blob=new Blob([u8],{type:d.fmt==='otf'?'font/otf':'font/ttf'}),url=URL.createObjectURL(blob);
        saveMyFont({alias:'MyHand_'+Date.now(),family:d.family,fmt:d.fmt,blob});  // 제 뜯을 타이핑용으로 기억
        go('font_result',{url,family:d.family,fmt:d.fmt,filled:d.filled_cells,total:d.total_cells,syllables:d.syllables});}
      catch(e){st.innerHTML=`<div class="note err">⚠ ${e.message}</div>`;bb.disabled=false;}};

      feed.innerHTML=rows.map(rv=>{
        const multi=(rv.images||[]).length>1;
        const imgs=(rv.images||[]).map(u=>`<img src="${esc(u)}" loading="lazy" referrerpolicy="no-referrer" alt="">`).join('');
        const cnt=multi?`<div class="ig-count">1/${rv.images.length}</div>`:'';
        const dots=multi?`<div class="ig-dots">${rv.images.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div>`:'';
        return `<div class="ig"><div class="ig-car"><div class="ig-track">${imgs}</div>${cnt}</div>${dots}<div class="ig-body"><div class="ig-date">${esc(rv.date||'')}</div><div class="ig-text">${esc(rv.content||'')}</div></div></div>`;
      }).join('');
      feed.querySelectorAll('.ig').forEach(post=>{
        const track=post.querySelector('.ig-track'),count=post.querySelector('.ig-count'),dots=[...post.querySelectorAll('.ig-dots i')];
        if(!track||track.children.length<2)return;
        track.addEventListener('scroll',()=>{
          const i=Math.round(track.scrollLeft/track.clientWidth);
          if(count)count.textContent=(i+1)+'/'+track.children.length;
          dots.forEach((d,k)=>d.classList.toggle('on',k===i));
        },{passive:true});
      });
    }).catch(fail);
  },

        const rq=await api(`/api/admin/requests?token=${encodeURIComponent(token)}`);
        rl.innerHTML=(rq.requests||[]).map(r=>`<div class="post"><p>${esc(r.text)}</p><div class="muted" style="font-size:11px;margin-top:6px">${esc((r.created_at||'').slice(0,16).replace('T',' '))}</div></div>`).join('')||'<div class="muted">요청이 없습니다.</div>';
        const d=await api(`/api/admin/queue?token=${encodeURIComponent(token)}`);st.textContent='';
        q.innerHTML=d.queue.map(p=>`<div class="gcard"><img src="${p.image}" loading="lazy"><div class="bar"><span class="muted">신고 ${p.reports} · ${p.kind}</span></div>
          <div class="row" style="padding:0 10px 10px"><button class="btn ghost" onclick="mod(${p.id},true,this)">허용</button><button class="btn ghost" style="color:var(--ember)" onclick="mod(${p.id},false,this)">삭제</button></div></div>`).join('')||'<div class="muted">검토할 글이 없습니다.</div>';}
      catch(e){st.textContent='';alert(e.message);}}
    window.mod=async(id,allow,btn)=>{const fd=new FormData();fd.append('allow',allow);fd.append('token',token);
      try{await api(`/api/admin/posts/${id}/moderate`,{method:'POST',body:fd});btn.closest('.gcard,.post').remove();}catch(e){alert(e.message);}};
    el.querySelector('#loadQ').onclick=load;
  },
};
window.showPhoto=(src)=>{const o=document.createElement('div');o.className='lightbox';const im=document.createElement('img');im.src=src;o.appendChild(im);o.onclick=()=>o.remove();document.body.appendChild(o);};
window.reportPost=async(id,btn)=>{if(!confirm('이 글을 신고할까요? 즉시 숨겨집니다.'))return;try{await api(`/api/posts/${id}/report`,{method:'POST'});btn.closest('.gcard,.post').remove();}catch(e){alert(e.message);}};
window.likeC=async(id,btn)=>{try{const d=await api(`/api/challenge/${id}/like`,{method:'POST'});btn.classList.add('on');btn.textContent='♥ '+d.likes;}catch(e){}};

if(location.hash==='#admin') reset('admin'); else reset('cover');
</script>
</body>
</html>
